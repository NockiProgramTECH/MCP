[project]
name = "openclaw-mcp"
version = "0.1.0"
description = "Secure MCP server for OpenClaw service integrations"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "OpenClaw MCP contributors" }]
dependencies = [
    "mcp>=1.13.0,<2.0.0",
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "httpx>=0.28,<1.0",
    "python-dotenv>=1.1,<2.0",
]

[project.scripts]
openclaw-mcp = "openclaw_mcp.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.17,<2.0",
    "pytest>=8.4,<9.0",
    "pytest-asyncio>=1.1,<2.0",
    "respx>=0.22,<1.0",
    "ruff>=0.12,<1.0",
]

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openclaw_mcp"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"
